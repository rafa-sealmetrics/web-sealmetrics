# Cloudflare Worker config — Sealmetrics Ad Leakage Scanner
# Deploy: `wrangler deploy`
# Local dev: `wrangler dev`

name = "scan-worker"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# Route público — apuntar DNS de scan.sealmetrics.com a este worker
# (ver README.md para los pasos manuales en Cloudflare)
routes = [
  { pattern = "scan.sealmetrics.com/*", custom_domain = true }
]

# KV para rate-limit por hostname target
# Crear con: wrangler kv namespace create RATE_LIMIT
# Luego pegar el id real abajo (placeholder por ahora)
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_REAL_KV_ID"

# Variables públicas (no secretos)
[vars]
ALLOWED_ORIGINS = "https://sealmetrics.com,https://www.sealmetrics.com"
MAX_HTML_BYTES = "524288"
FETCH_TIMEOUT_MS = "6000"
RATE_LIMIT_TTL_SECONDS = "3600"
RATE_LIMIT_PER_HOSTNAME_NO_EMAIL = "1"
RATE_LIMIT_PER_HOSTNAME_WITH_EMAIL = "10"
INGEST_URL = ""  # se completa cuando Sprint 3 expose el endpoint del zoo

# Secretos (NO van aquí — se setean con wrangler secret put):
#   TURNSTILE_SECRET    — secret de Cloudflare Turnstile
#   INGEST_TOKEN        — shared secret con el endpoint del zoo
