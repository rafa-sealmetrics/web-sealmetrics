name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Must run BEFORE the artifact is published: it compares the freshly built
      # sitemap against the one still live, and after the deploy those are the
      # same file. Skips cleanly when INDEXNOW_KEY is unset, so a fork or a
      # first-time contributor's run is unaffected.
      - name: Notify IndexNow of changed URLs
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/indexnow.mjs

      # `include-hidden-files` defaults to false, which silently drops every
      # dotfile from the published site. That cost an afternoon: the OpenAI
      # domain-verification token lived at out/.well-known/openai-apps-challenge,
      # the build was green, the deploy was green, and the URL 404ed. Anything
      # under a dot directory — well-known challenges, .nojekyll — needs this.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # GitHub Pages occasionally returns a transient "Deployment failed, try
      # again later." Retry up to two more times before failing the job.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before final retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 60

      - id: deployment_retry_2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v5
